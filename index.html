<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="style.css">
  <title>JS Bin</title>
</head>
<body>
  <div class="keypad-container">
    <input type="text" id="display" readonly placeholder="Enter PIN" />

    <div class="keypad-grid">
      <button class="key-btn" value="1">1</button>
      <button class="key-btn" value="2">2</button>
      <button class="key-btn" value="3">3</button>

      <button class="key-btn" value="4">4</button>
      <button class="key-btn" value="5">5</button>
      <button class="key-btn" value="6">6</button>

      <button class="key-btn" value="7">7</button>
      <button class="key-btn" value="8">8</button>
      <button class="key-btn" value="9">9</button>

      <button class="key-btn clear-btn" value="clear">C</button>
      <button class="key-btn" value="0">0</button>
      <button class="key-btn back-btn" value="back">⌫</button>
      <iframe id="movie" src="https://docs.google.com/presentation/d/e/2PACX-1vRO2enmC_Z49qy9UEIJJHGQMCMF5jmzBMU2GDUM9et9ItquSpkaNeyCko-R4YHF4HU4QbgY5h_FsAYq/pubembed?start=false&loop=false&delayms=3000" frameborder="0" width="960" height="569" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    </div>
  </div>
 <script src="script.js"></script>
</body>
</html>
